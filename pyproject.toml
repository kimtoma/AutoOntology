[project]
name = "autoontology"
version = "0.1.0"
description = "Turn structured and unstructured enterprise data into one ontology with NVIDIA Auto Ontology, Apache Ossie and the Open Knowledge Format."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "auto-ontology-server>=1.1.0",
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "referencing>=0.36",  # already pulled in by jsonschema; imported directly by export.ossie
    "sse-starlette>=3.6.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
autoontology = "autoontology.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoontology"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
auto-ontology-server = { path = "vendor/auto-ontology", editable = true }

[tool.ruff]
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real Postgres/Ollama; runs only with AUTOONTOLOGY_INTEGRATION=1",
]
filterwarnings = [
    # langchain_nvidia_ai_endpoints DeprecationWarning "The 'max_tokens' parameter is
    # deprecated ... use 'max_completion_tokens'", triggered by the vendored upstream
    # (vendor/auto-ontology/auto_ontology/utils/llm_invoke.py builds ChatNVIDIA with
    # max_tokens). Vendor code is pinned and must not be edited.
    "ignore:The 'max_tokens' parameter is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pymupdf>=2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "python-docx>=1.2.0",
    "ruff>=0.17.3",
]
